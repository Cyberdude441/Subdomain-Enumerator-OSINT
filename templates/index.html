<!DOCTYPE html>
<html>
<head>
<title>Recon Terminal</title>
<style>
body{
    background:#000;
    color:#00ff00;
    font-family:Courier New, monospace;
    padding:40px;
}
input,button{
    background:#000;
    border:1px solid #00ff00;
    color:#00ff00;
    padding:8px;
    font-family:inherit;
}
#terminal{
    margin-top:20px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>Advanced Recon Terminal</h2>

<form method="POST">
    > Enter Target Domain:<br><br>
    <input type="text" name="domain" required>
    <button type="submit">SCAN</button>
</form>

<div id="terminal"></div>

<script>
const results = [
{% if results %}
{% for r in results %}
"{{ r.subdomain }}  |  {{ r.ip }}  |  {{ r.status }}",
{% endfor %}
{% endif %}
];

const terminal = document.getElementById("terminal");

function typeWriter(text, callback){
    let i=0;
    function typing(){
        if(i<text.length){
            terminal.innerHTML+=text.charAt(i);
            i++;
            setTimeout(typing,15);
        }else{
            terminal.innerHTML+="\n";
            if(callback) callback();
        }
    }
    typing();
}

function startOutput(){
    terminal.innerHTML="> Scan Complete\n\n";
    let index=0;
    function next(){
        if(index<results.length){
            typeWriter(results[index],()=>{
                index++;
                next();
            });
        }
    }
    next();
}

window.onload=function(){
    if(results.length>0){
        startOutput();
    }
};
</script>

</body>
</html>
